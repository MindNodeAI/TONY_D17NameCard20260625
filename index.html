<body class="bg-slate-50 text-slate-800">

    <div id="landscape-warning">
        <div class="text-4xl mb-4">📱↻</div>
        <h2 class="text-xl font-bold mb-2">建議使用直向瀏覽</h2>
        <p class="text-sm text-slate-400 mb-6">為獲得最佳體驗，請將手機轉正。</p>
        <button onclick="document.getElementById('landscape-warning').style.display='none'" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm border border-slate-500 transition-colors">
            我正在使用電腦 / 略過
        </button>
    </div>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Camera, Upload, Settings, Save, User, FileText, Download, X, Check, Loader2, Search, HelpCircle, ExternalLink, CloudLightning, Sparkles, Lightbulb, Copy, MessageSquare, Image as ImageIcon, Mail, Database, UploadCloud, RefreshCw, FilePlus, MapPin, Tag, Eye, EyeOff, ShieldAlert, Users, FileBarChart, LogOut, ArrowLeft, Trash2, Key } from 'lucide-react';

        // --- Firebase Init ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, deleteDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZv3x12RuMke6eEg8qB88Uv5vuuF_PrD0",
            authDomain: "d17-business-card-recognition.firebaseapp.com",
            projectId: "d17-business-card-recognition",
            storageBucket: "d17-business-card-recognition.firebasestorage.app",
            messagingSenderId: "1037041583244",
            appId: "1:1037041583244:web:d0d818ce12da14f48967a9",
            measurementId: "G-0KKH08BTMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const MASTER_ADMIN_EMAIL = 'mindnodeai@gmail.com';

        const APP_CONFIG = {
            title: "名片辨識 APP",
            version: "4.0 (SaaS Enterprise Pro)", 
            themeColor: "bg-slate-800",
            logoUrl: "https://i.postimg.cc/fT2sQW09/1.png",
            profileUrl: "https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg",
            copyright: "© 2026 TONY STUDIO. 本教材由 TONY STUDIO 楊文澤顧問設計. All Rights Reserved."
        };

        const DEFAULT_SCHEMA = {
            name: "", name_eng: "", title: "", company: "", phone_mobile: "", phone_office: "", email: "", address: "", website: "", notes: "",
            meetDate: new Date().toISOString().split('T')[0], 
            careerHistory: "", 
            meetContext: "", tags: [], aiInsights: { industry: "", roleExpertise: "", companyNature: "", businessType: "" }
        };

        const FIELD_LABELS = {
            meetDate: "📅 認識 / 換片日期", meetContext: "📍 互動情境 (在哪裡認識？)", name: "姓名 Name", name_eng: "英文姓名 English Name", title: "職稱 Title", company: "公司名稱 Company", 
            careerHistory: "🔄 職務異動 / 其他抬頭 (Career History)", phone_mobile: "行動電話 Mobile", phone_office: "公司電話 Tel", email: "電子郵件 Email", address: "地址 Address", website: "網站 Website", notes: "備註 Notes"
        };

        const EXPORT_HEADERS = {
            name: "姓名", name_eng: "英文姓名", title: "職稱", company: "公司名稱", careerHistory: "職務異動/其他抬頭", phone_mobile: "行動電話", phone_office: "公司電話", 
            email: "Email", address: "地址", website: "網站", meetDate: "認識日期", meetContext: "互動情境(哪裡認識)", notes: "備註", capture_date: "建檔時間"
        };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); 
            reader.onerror = reject;
        });

        const compressImage = (file, maxWidth = 1200, quality = 0.8) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });

        const downloadJSON = (data) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = `business_cards_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const downloadCSV = (data, filename = 'export', headersMap = EXPORT_HEADERS) => {
            const keys = Object.keys(headersMap);
            const csvContent = [
                keys.map(k => headersMap[k]).join(','), 
                ...data.map(row => keys.map(key => {
                    let val = row[key] || '';
                    if ((key === 'capture_date' || key === 'createdAt') && val) val = new Date(val).toLocaleDateString();
                    val = val.toString().replace(/"/g, '""');
                    return `"${val}"`;
                }).join(','))
            ].join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); // BOM added here
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.setAttribute('href', url); link.setAttribute('download', `${filename}_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        const downloadExcel = (data) => {
            if (typeof XLSX === 'undefined') { alert("Excel 模組未載入"); return; }
            const keys = Object.keys(EXPORT_HEADERS);
            const exportData = data.map(row => {
                let newRow = {};
                keys.forEach(key => {
                    let val = row[key] || '';
                    if (key === 'capture_date' && val) val = new Date(val).toLocaleDateString();
                    newRow[EXPORT_HEADERS[key]] = val;
                });
                return newRow;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "名片資料");
            XLSX.writeFile(workbook, `business_cards_export_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        const exportWord = (htmlContent, filename) => {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>AI Analysis Report</title></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + htmlContent + footer;
            const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename + '.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const parseAIResponse = (text) => {
            try {
                const cleanText = text.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();
                return JSON.parse(cleanText);
            } catch (e) {
                console.error("JSON 解析失敗:", text);
                throw new Error("AI 回傳資料格式異常，無法解析。");
            }
        };

        const Card = ({ children, className = "", onClick }) => (
            <div onClick={onClick} className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, icon: Icon }) => {
            const baseStyle = "flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-slate-800 text-white hover:bg-slate-700 shadow-md",
                secondary: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 shadow-sm",
                danger: "bg-red-500 text-white hover:bg-red-600",
                ai: "bg-gradient-to-r from-violet-600 to-indigo-600 text-white hover:from-violet-700 hover:to-indigo-700 shadow-md border border-violet-400",
                success: "bg-green-600 text-white hover:bg-green-700 shadow-md",
                ghost: "bg-transparent text-slate-600 hover:bg-slate-100"
            };
            return (
                <button type="button" onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant] || variants.primary} ${className}`}>
                    {Icon && <Icon size={18} className="mr-2" />}
                    {children}
                </button>
            );
        };

        const AuthView = ({ onAuthSuccess, onError, onSuccessMsg }) => {
            const [mode, setMode] = useState('login'); // login, register, forgot
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [realName, setRealName] = useState('');
            const [identity, setIdentity] = useState('visitor'); // student, visitor
            const [showPassword, setShowPassword] = useState(false);
            const [loading, setLoading] = useState(false);

            const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!email || !password || !realName) return onError("請填寫所有必填欄位。");
                setLoading(true);
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Create Profile
                    const isMasterAdmin = email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase();
                    const profileRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'userProfiles', user.uid);
                    await setDoc(profileRef, {
                        email: user.email,
                        realName,
                        identity,
                        role: isMasterAdmin ? 'admin' : 'user',
                        createdAt: new Date().toISOString(),
                        loginCount: 0,
                        status: 'active'
                    });

                    // Send Verification
                    await sendEmailVerification(user);
                    await signOut(auth); // Force logout until verified
                    onSuccessMsg("註冊成功！請至信箱點擊驗證連結後方可登入。(溫馨提醒：註冊確認信有時會跑到「垃圾郵件匣」，請記得前往確認唷！)");
                    setMode('login');
                    setPassword('');
                } catch (err) {
                    let msg = "註冊失敗";
                    if (err.code === 'auth/email-already-in-use') msg = "此信箱已被註冊。";
                    if (err.code === 'auth/weak-password') msg = "密碼太弱，請至少輸入 6 個字元。";
                    onError(msg + " (" + err.message + ")");
                } finally { setLoading(false); }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!email || !password) return onError("請填寫信箱與密碼。");
                setLoading(true);
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    if (!user.emailVerified) {
                        await signOut(auth);
                        onError("登入失敗：您的信箱尚未驗證，請至信箱點擊驗證連結。(可能在垃圾郵件匣)");
                        setLoading(false);
                        return;
                    }

                    // Auth success is handled by the global onAuthStateChanged listener in App.
                } catch (err) {
                    let msg = "登入失敗";
                    if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') msg = "信箱或密碼錯誤。";
                    onError(msg);
                    setLoading(false); // Only stop loading if error, otherwise let listener take over
                }
            };

            const handleForgot = async (e) => {
                e.preventDefault();
                if (!email) return onError("請先填寫您的註冊信箱。");
                setLoading(true);
                try {
                    await sendPasswordResetEmail(auth, email);
                    onSuccessMsg("密碼重置信已發送！(溫馨提醒：確認信有時會跑到「垃圾郵件匣」，請記得前往確認唷！)");
                    setMode('login');
                } catch (err) {
                    onError("發送失敗：" + err.message);
                } finally { setLoading(false); }
            };

            return (
                <div className="min-h-[100dvh] flex items-center justify-center p-4 bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                    <Card className="w-full max-w-md p-8 animate-fade-in shadow-2xl border-slate-700 bg-white/95 backdrop-blur">
                        <div className="text-center mb-8">
                            <img src={APP_CONFIG.logoUrl} alt="Logo" className="h-16 w-auto mx-auto mb-4 drop-shadow-md" />
                            <h1 className="text-2xl font-bold text-slate-800">{APP_CONFIG.title}</h1>
                            <p className="text-sm text-slate-500 mt-2 font-medium bg-indigo-50 inline-block px-3 py-1 rounded-full text-indigo-700 border border-indigo-100">
                                SaaS 企業級雲端版
                            </p>
                        </div>

                        {mode === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">電子信箱 Email</label>
                                    <input type="email" required value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="name@company.com" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">密碼 Password</label>
                                    <div className="relative">
                                        <input type={showPassword ? 'text' : 'password'} required value={password} onChange={(e)=>setPassword(e.target.value)} className="w-full p-3 pr-10 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            {showPassword ? <EyeOff size={18} /> : <Eye size={18} />}
                                        </button>
                                    </div>
                                </div>
                                <Button variant="primary" className="w-full py-3" onClick={handleLogin} disabled={loading}>
                                    {loading ? <Loader2 size={18} className="animate-spin" /> : '登入系統 Login'}
                                </Button>
                                <div className="flex justify-between text-sm mt-4">
                                    <button type="button" onClick={() => setMode('forgot')} className="text-indigo-600 hover:underline font-medium">忘記密碼？</button>
                                    <span className="text-slate-500">還沒有帳號？ <button type="button" onClick={() => setMode('register')} className="text-indigo-600 hover:underline font-bold">立即註冊</button></span>
                                </div>
                            </form>
                        )}

                        {mode === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">真實姓名 Real Name</label>
                                    <input type="text" required value={realName} onChange={(e)=>setRealName(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="請填寫您的真實姓名" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">會員身分 Identity</label>
                                    <select value={identity} onChange={(e)=>setIdentity(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                        <option value="student">TONY 老師學員</option>
                                        <option value="visitor">一般訪客 (非學員)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">電子信箱 Email (做為登入帳號)</label>
                                    <input type="email" required value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="需收取驗證信" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">設定密碼 Password</label>
                                    <div className="relative">
                                        <input type={showPassword ? 'text' : 'password'} required value={password} onChange={(e)=>setPassword(e.target.value)} className="w-full p-3 pr-10 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="至少 6 個字元" />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                            {showPassword ? <EyeOff size={18} /> : <Eye size={18} />}
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded-lg text-xs leading-relaxed">
                                    💡 <strong>溫馨提醒：</strong>為確保帳號安全，註冊後系統會發送確認信。信件有時會跑到<strong>「垃圾郵件匣」</strong>，請記得前往確認唷！
                                </div>

                                <Button variant="primary" className="w-full py-3" onClick={handleRegister} disabled={loading}>
                                    {loading ? <Loader2 size={18} className="animate-spin" /> : '建立帳號 Register'}
                                </Button>
                                <div className="text-center text-sm mt-4">
                                    <span className="text-slate-500">已經有帳號了？ <button type="button" onClick={() => setMode('login')} className="text-indigo-600 hover:underline font-bold">返回登入</button></span>
                                </div>
                            </form>
                        )}

                        {mode === 'forgot' && (
                            <form onSubmit={handleForgot} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">註冊的電子信箱 Email</label>
                                    <input type="email" required value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="name@company.com" />
                                </div>
                                <div className="bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded-lg text-xs leading-relaxed">
                                    💡 <strong>溫馨提醒：</strong>重置信有時會跑到<strong>「垃圾郵件匣」</strong>，請留意。
                                </div>
                                <Button variant="primary" className="w-full py-3" onClick={handleForgot} disabled={loading}>
                                    {loading ? <Loader2 size={18} className="animate-spin" /> : '發送重置信件'}
                                </Button>
                                <div className="text-center text-sm mt-4">
                                    <button type="button" onClick={() => setMode('login')} className="text-slate-500 hover:text-slate-700 hover:underline font-medium flex items-center justify-center w-full">
                                        <ArrowLeft size={16} className="mr-1" /> 返回登入
                                    </button>
                                </div>
                            </form>
                        )}
                    </Card>
                </div>
            );
        };

        const AdminDashboardView = ({ onBack, currentProfile, onError, onSuccessMsg, onEnterUserHistory, apiKey }) => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [reportLoading, setReportLoading] = useState(false);
            const [reportResult, setReportResult] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            
            const [confirmingRoleUid, setConfirmingRoleUid] = useState(null);
            const [confirmingDeleteUid, setConfirmingDeleteUid] = useState(null);
            
            const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';

            useEffect(() => {
                fetchUsers();
            }, []);

            const fetchUsers = async () => {
                setLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, 'artifacts', activeAppId, 'public', 'data', 'userProfiles'));
                    const userList = [];
                    snapshot.forEach(doc => {
                        if(doc.data().status !== 'deleted') {
                            userList.push({ uid: doc.id, ...doc.data() });
                        }
                    });
                    userList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setUsers(userList);
                } catch (err) {
                    onError("獲取會員列表失敗: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const executeToggleRole = async (user) => {
                if (user.email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase()) {
                    setConfirmingRoleUid(null);
                    return onError("系統創作者的權限不可更改。");
                }
                const newRole = user.role === 'admin' ? 'user' : 'admin';
                
                try {
                    const profileRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'userProfiles', user.uid);
                    await updateDoc(profileRef, { role: newRole });
                    setUsers(users.map(u => u.uid === user.uid ? { ...u, role: newRole } : u));
                    onSuccessMsg(`已將 ${user.realName} 的權限更新為 ${newRole}`);
                } catch (err) {
                    onError("權限更新失敗: " + err.message);
                } finally {
                    setConfirmingRoleUid(null);
                }
            };

            const executeDeleteUser = async (user) => {
                if (user.email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase()) {
                    setConfirmingDeleteUid(null);
                    return onError("系統創作者不可刪除。");
                }
                
                try {
                    const profileRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'userProfiles', user.uid);
                    await updateDoc(profileRef, { status: 'deleted', role: 'deleted' });
                    setUsers(users.filter(u => u.uid !== user.uid));
                    onSuccessMsg(`已停用會員 ${user.realName}`);
                } catch (err) {
                    onError("操作失敗: " + err.message);
                } finally {
                    setConfirmingDeleteUid(null);
                }
            };

            const handleExportUsers = () => {
                const headersMap = {
                    email: "電子信箱", realName: "真實姓名", identity: "註冊身分", role: "系統權限", loginCount: "登入次數", createdAt: "註冊時間"
                };
                const formattedUsers = users.map(u => ({
                    ...u,
                    identity: u.identity === 'student' ? 'TONY老師學員' : '一般訪客',
                    role: u.role === 'admin' ? '管理員' : '一般用戶'
                }));
                downloadCSV(formattedUsers, 'SaaS_Members', headersMap);
            };

            const generateReport = async () => {
                if (!startDate || !endDate) return onError("請選擇起訖日期");
                if (!apiKey) return onError("產生 AI 報告需先在設定中填寫 Gemini API Key");
                
                setReportLoading(true);
                setReportResult('');
                try {
                    // 1. Fetch all cards for all users within date range
                    let allCards = [];
                    for (const user of users) {
                        const cardsSnapshot = await getDocs(collection(db, 'artifacts', activeAppId, 'users', user.uid, 'business_cards'));
                        cardsSnapshot.forEach(doc => {
                            const data = doc.data();
                            const dateCheck = data.meetDate || data.capture_date?.split('T')[0];
                            if (dateCheck && dateCheck >= startDate && dateCheck <= endDate) {
                                allCards.push({
                                    ownerName: user.realName,
                                    ...data
                                });
                            }
                        });
                    }

                    if (allCards.length === 0) {
                        setReportLoading(false);
                        return onError("該期間內沒有任何名片新增紀錄，無法產生報告。");
                    }

                    // 2. Prepare JSON summary to save tokens
                    const summary = allCards.map(c => ({
                        聯絡人: c.name, 公司: c.company, 職稱: c.title, 產業推測: c.aiInsights?.industry, 情境: c.meetContext, 標籤: c.tags?.join(','), 建立者: c.ownerName
                    }));

                    // 3. Call Gemini
                    const prompt = `您是頂級的商務關係智能分析師。我將提供一段時間內系統收集到的名片摘要(JSON格式)。
請以繁體中文撰寫一份專業的「商務人脈累積與趨勢分析報告」。
請包含以下章節，並使用 HTML 標籤排版 (如 <h1>, <h2>, <ul>, <p>, <strong>，請勿使用 Markdown \`\`\` 等符號，直接輸出純 HTML)：
1. 執行摘要 (Executive Summary)：這段時間的人脈成長概況。
2. 產業分佈與趨勢：分析這些聯絡人所屬的產業集群，哪些領域最為熱絡。
3. 決策者分佈：分析聯絡人的職階結構(如高階主管比例)。
4. 關鍵場合與情境分析：總結大家都在哪些場合(meetContext)建立關係。
5. 策略建議：基於以上數據，對於未來的商務拓展與人脈維繫給予具體行動建議。

數據：
${JSON.stringify(summary)}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const resultData = await response.json();
                    if (resultData.error) throw new Error(resultData.error.message);
                    
                    let htmlContent = resultData.candidates[0].content.parts[0].text;
                    // Clean up markdown block if API still returned it despite instructions
                    htmlContent = htmlContent.replace(/```html/gi, '').replace(/```/g, '').trim();
                    setReportResult(htmlContent);
                    onSuccessMsg("分析報告生成完畢！");
                } catch (err) {
                    onError("生成報告失敗: " + err.message);
                } finally {
                    setReportLoading(false);
                }
            };

            const handleExportWord = () => {
                if (!reportResult) return;
                exportWord(reportResult, `AI_Business_Report_${startDate}_to_${endDate}`);
            };

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 animate-fade-in pb-20">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center">
                                <ShieldAlert className="mr-3 text-red-600" /> SaaS 管理者控制台
                            </h2>
                            <p className="text-sm text-slate-500 mt-1">目前登入身分：{currentProfile?.realName} ({currentProfile?.email})</p>
                        </div>
                        <Button variant="secondary" onClick={onBack} icon={ArrowLeft}>返回前台</Button>
                    </div>

                    {/* AI 報告區塊 */}
                    <Card className="mb-8 p-6 bg-gradient-to-r from-slate-800 to-indigo-900 text-white">
                        <div className="flex items-center mb-4">
                            <Sparkles className="mr-2 text-indigo-300" />
                            <h3 className="text-xl font-bold">AI 全站人脈數據分析報告</h3>
                        </div>
                        <p className="text-sm text-slate-300 mb-6">設定起訖時間，系統將自動統合全站會員在這段期間內建立的名片資料，並交由 Gemini 產出深度的商務趨勢洞察與策略建議。</p>
                        
                        <div className="flex flex-wrap gap-4 items-end bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1 uppercase">開始日期</label>
                                <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="p-2 rounded bg-slate-800 border border-slate-600 text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1 uppercase">結束日期</label>
                                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="p-2 rounded bg-slate-800 border border-slate-600 text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <Button variant="ai" onClick={generateReport} disabled={reportLoading} className="py-2.5">
                                {reportLoading ? <Loader2 className="animate-spin mr-2" size={18} /> : <FileBarChart className="mr-2" size={18} />}
                                {reportLoading ? 'AI 正在深度運算中...' : '產生 AI 洞察報告'}
                            </Button>
                            
                            {reportResult && (
                                <Button variant="success" onClick={handleExportWord} className="py-2.5 bg-blue-600 hover:bg-blue-700">
                                    <Download className="mr-2" size={18} /> 匯出為 Word (.doc)
                                </Button>
                            )}
                        </div>

                        {reportResult && (
                            <div className="mt-6 bg-white text-slate-800 p-8 rounded-lg max-h-[500px] overflow-y-auto prose prose-slate max-w-none shadow-inner" id="report-content" dangerouslySetInnerHTML={{__html: reportResult}}></div>
                        )}
                    </Card>

                    {/* 會員列表區塊 */}
                    <Card className="flex flex-col overflow-hidden">
                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 className="font-bold text-slate-700 flex items-center"><Users className="w-4 h-4 mr-2" /> 會員名單管理</h3>
                            <Button variant="secondary" onClick={handleExportUsers} icon={Download} className="text-sm py-1.5 px-3">匯出 CSV (含 BOM)</Button>
                        </div>
                        
                        {loading ? (
                            <div className="flex justify-center py-12"><Loader2 className="animate-spin text-slate-400" size={32} /></div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[1000px]">
                                    <thead className="bg-slate-100/50">
                                        <tr>
                                            <th className="px-4 py-3 text-xs font-bold text-slate-500 uppercase">會員 (姓名/Email)</th>
                                            <th className="px-4 py-3 text-xs font-bold text-slate-500 uppercase">註冊身分</th>
                                            <th className="px-4 py-3 text-xs font-bold text-slate-500 uppercase">系統權限</th>
                                            <th className="px-4 py-3 text-xs font-bold text-slate-500 uppercase">註冊時間 / 登入次數</th>
                                            <th className="px-4 py-3 text-xs font-bold text-slate-500 uppercase text-right">管理操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {users.map(user => {
                                            const isMaster = user.email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase();
                                            return (
                                            <tr key={user.uid} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-3">
                                                    <div className="font-bold text-slate-800 flex items-center">
                                                        {user.realName}
                                                        {isMaster && <ShieldAlert size={14} className="ml-2 text-red-500" title="系統創作者" />}
                                                    </div>
                                                    <div className="text-xs text-slate-500">{user.email}</div>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-1 text-xs rounded-full font-medium border ${user.identity === 'student' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                                        {user.identity === 'student' ? 'TONY老師學員' : '一般訪客'}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-1 text-[11px] rounded-full font-bold uppercase tracking-wide ${user.role === 'admin' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                        {user.role}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3 text-sm text-slate-600">
                                                    <div>{new Date(user.createdAt).toLocaleDateString()}</div>
                                                    <div className="text-xs text-slate-400 mt-0.5">登入: {user.loginCount || 0} 次</div>
                                                </td>
                                                <td className="px-4 py-3 text-right">
                                                    {confirmingDeleteUid === user.uid ? (
                                                        <div className="flex items-center justify-end gap-2 animate-fade-in">
                                                            <button onClick={() => executeDeleteUser(user)} className="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded transition shadow-sm font-bold">確定停用</button>
                                                            <button onClick={() => setConfirmingDeleteUid(null)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded transition">取消</button>
                                                        </div>
                                                    ) : confirmingRoleUid === user.uid ? (
                                                        <div className="flex items-center justify-end gap-2 animate-fade-in">
                                                            <button onClick={() => executeToggleRole(user)} className="text-xs bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1.5 rounded transition shadow-sm font-bold">確認切換</button>
                                                            <button onClick={() => setConfirmingRoleUid(null)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded transition">取消</button>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-center justify-end gap-2">
                                                            <button onClick={() => onEnterUserHistory(user.uid, user.realName)} className="px-2.5 py-1.5 text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 rounded hover:bg-indigo-100 transition flex items-center font-medium">
                                                                <Database size={14} className="mr-1"/> 查看名片
                                                            </button>
                                                            <button onClick={() => setConfirmingRoleUid(user.uid)} disabled={isMaster} className="px-2.5 py-1.5 text-xs bg-slate-100 text-slate-700 rounded hover:bg-slate-200 transition flex items-center disabled:opacity-30 disabled:cursor-not-allowed border border-slate-200">
                                                                <Key size={14} className="mr-1"/> 切換權限
                                                            </button>
                                                            <button onClick={() => setConfirmingDeleteUid(user.uid)} disabled={isMaster} className="p-1.5 text-red-500 hover:bg-red-50 rounded transition disabled:opacity-30 disabled:cursor-not-allowed">
                                                                <Trash2 size={16} />
                                                            </button>
                                                        </div>
                                                    )}
                                                </td>
                                            </tr>
                                        )})}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        const SettingsView = ({ apiKey, setApiKey, scriptUrl, setScriptUrl, onBack, onLogout, profile }) => {
            const [showHelp, setShowHelp] = useState(false);
            return (
                <div className="max-w-2xl mx-auto p-6 animate-fade-in pb-20">
                    <Card className="p-6 mb-6 bg-indigo-50 border-indigo-100">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-indigo-900 text-lg">帳號資訊</h3>
                                <p className="text-sm text-indigo-700 mt-1">{profile?.realName} ({profile?.email}) - 身分: {profile?.identity === 'student' ? '學員' : '訪客'}</p>
                            </div>
                            <Button variant="danger" onClick={onLogout} icon={LogOut} className="py-2 text-sm">登出系統</Button>
                        </div>
                    </Card>
                    <Card className="p-6">
                        <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center">
                            <Settings className="mr-2" /> 系統偏好設定
                        </h2>
                        <div className="space-y-6">
                            <div className="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-lg text-sm mb-4">
                                💡 提示：API 設定會自動儲存在此裝置的瀏覽器中。
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">Google Gemini API Key (必填)</label>
                                <input 
                                    type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="輸入您的 AI Studio Key..."
                                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none"
                                />
                            </div>
                            <div className="pt-4 border-t border-slate-100">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="block text-sm font-medium text-slate-700 flex items-center">
                                        <CloudLightning size={16} className="mr-1 text-green-600" /> Google Apps Script URL (雲端備份用)
                                    </label>
                                </div>
                                <input type="text" value={scriptUrl} onChange={(e) => setScriptUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..../exec" className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none font-mono text-sm" />
                            </div>
                            <div className="pt-4 border-t border-slate-100 flex justify-end">
                                <Button onClick={onBack} variant="primary">確認並返回</Button>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AboutView = ({ onBack }) => {
            return (
                <div className="max-w-4xl mx-auto p-6 animate-fade-in pb-20">
                    <div className="mb-6"><Button onClick={onBack} variant="secondary" icon={X}>關閉</Button></div>
                    <Card className="p-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="col-span-1 flex flex-col items-center text-center">
                                <div className="w-48 h-48 rounded-full overflow-hidden border-4 border-slate-100 shadow-lg mb-4">
                                    <img src={APP_CONFIG.profileUrl} alt="TONY 老師" className="w-full h-full object-cover" />
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800">TONY 老師</h2>
                                <p className="text-slate-500 font-medium">AI 導師 / 資深顧問 / 創業家</p>
                            </div>
                            <div className="col-span-1 md:col-span-2 space-y-6">
                                <div>
                                    <h3 className="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2 mb-3">關於創作者</h3>
                                    <div className="text-slate-600 leading-relaxed space-y-4">
                                        <p>我是一位擁有深厚業界經驗的品牌行銷、行銷科技 (MarTech)、生成式 AI 創作者及專業講師。熱愛創新與思考，致力於將複雜的商業理論轉化為落地的實戰應用。</p>
                                        <p>我具備設計、行銷、商業與創業的全方位實務經驗，並曾於上市公司擔任長達 14 年的發言人，深知企業運營、媒體公關與人脈管理的核心痛點。</p>
                                        <p>開發這款「名片辨識 APP」的初衷，正是希望能結合最新的 AI 技術，解決商務人士在人脈整理上的繁瑣工作。透過科技賦能，讓我們能將更多寶貴的時間，專注於人與人之間真實的交流與價值的創造。</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AiAssistant = ({ data, apiKey, onError }) => {
            const [aiResult, setAiResult] = useState(null); 
            const [aiLoading, setAiLoading] = useState(false);
            const [activeTab, setActiveTab] = useState(null); 
            const [copied, setCopied] = useState(false);

            const generateContent = async (type) => {
                if (!apiKey) return onError("請先設定 API Key 才能使用 AI 功能！");
                
                setAiLoading(true); setActiveTab(type); setAiResult(null); setCopied(false);

                let prompt = type === 'email' 
                    ? `Act as a top-tier business secretary. Write a professional follow-up email in Traditional Chinese to: Name: ${data.name}, Title: ${data.title}, Company: ${data.company}. Tone: Warm, professional. Output Format: Subject: [Subject] Body: [Body]`
                    : `Act as a networking coach. Analyze this person: ${data.title} at ${data.company}. OUTPUT FORMAT: Subject: 🔍 職涯與話題分析 Body: 【職責推測】[Analysis] 【破冰三招】1. [Topic 1] 2. [Topic 2] 3. [Topic 3]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const result = await response.json();
                    if (result.error) throw new Error(result.error.message);
                    
                    const rawText = result.candidates[0].content.parts[0].text;
                    let subject = "商務信件"; let body = rawText;
                    const subjectMatch = rawText.match(/Subject:\s*(.*)/i);
                    const bodyMatch = rawText.match(/Body:\s*([\s\S]*)/i);
                    if (subjectMatch && bodyMatch) { subject = subjectMatch[1].trim(); body = bodyMatch[1].trim(); }
                    setAiResult({ subject, body });
                } catch (e) {
                    onError("AI 生成失敗: " + e.message);
                } finally { setAiLoading(false); }
            };

            const copyToClipboard = () => {
                if (!aiResult) return;
                const textToCopy = `主旨：${aiResult.subject}\n\n${aiResult.body}`;
                const textArea = document.createElement("textarea"); textArea.value = textToCopy; textArea.style.position = "fixed"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } 
                catch (err) { onError("複製失敗。"); }
                document.body.removeChild(textArea);
            };

            return (
                <div className="mt-8 border-t border-slate-200 pt-6">
                    <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center"><Sparkles size={16} className="mr-2 text-violet-500" /> AI 智能軍師</h4>
                    <div className="flex gap-3 mb-6">
                        <Button variant="ai" className="flex-1 text-sm py-3" icon={Mail} onClick={() => generateContent('email')} disabled={aiLoading}>
                            {aiLoading && activeTab === 'email' ? '撰寫中...' : '生成商務信'}
                        </Button>
                        <Button variant="secondary" className="flex-1 text-sm border-violet-200 text-violet-700 hover:bg-violet-50" icon={Lightbulb} onClick={() => generateContent('insight')} disabled={aiLoading}>
                            {aiLoading && activeTab === 'insight' ? '分析中...' : '話題分析'}
                        </Button>
                    </div>

                    {(aiResult || aiLoading) && (
                        <div className="animate-fade-in">
                            {aiLoading ? (
                                <div className="bg-slate-50 rounded-xl border border-slate-200 p-8 flex flex-col items-center justify-center text-slate-500">

                                <div className="hidden md:block"></div>

                                </div>
                                
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">{FIELD_LABELS['company']}</label>
                                    <input type="text" readOnly={readonly} value={data['company'] || ''} onChange={(e) => onChange('company', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />

                                <div>

                                    <input type="text" readOnly={readonly} value={data['phone_office'] || ''} onChange={(e) => onChange('phone_office', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                                </div>

                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">{FIELD_LABELS['email']}</label>
                                    <input type="email" readOnly={readonly} value={data['email'] || ''} onChange={(e) => onChange('email', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                                </div>
                                
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">{FIELD_LABELS['address']}</label>
                                    <input type="text" readOnly={readonly} value={data['address'] || ''} onChange={(e) => onChange('address', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                                </div>
                                
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-500">{FIELD_LABELS['website']}</label>
                                    <input type="text" readOnly={readonly} value={data['website'] || ''} onChange={(e) => onChange('website', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />

        const HistoryView = ({ history, onBack, onDelete, onSelect, onExportCSV, onExportExcel, viewTitle = "名片資料總表", readonly = false }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [deletingId, setDeletingId] = useState(null);
            const [showDuplicatesOnly, setShowDuplicatesOnly] = useState(false);

            const nameCounts = history.reduce((acc, item) => {
                const n = (item.name || '').trim().toLowerCase();
                if (n) acc[n] = (acc[n] || 0) + 1;
                return acc;
            }, {});

            let filteredHistory = history.filter(item => {
                const searchLower = searchTerm.toLowerCase();
                const matchesSearch = (
                    (item.name || '').toLowerCase().includes(searchLower) || 
                    (item.name_eng || '').toLowerCase().includes(searchLower) || 
                    (item.company || '').toLowerCase().includes(searchLower) ||
                    (item.title || '').toLowerCase().includes(searchLower) ||
                    (item.phone_mobile || '').toLowerCase().includes(searchLower) ||
                    (item.email || '').toLowerCase().includes(searchLower) ||
                    (item.meetContext || '').toLowerCase().includes(searchLower) ||
                    (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchLower)))
                );

                let matchesDuplicate = true;
                if (showDuplicatesOnly) {
                    const n = (item.name || '').trim().toLowerCase();
                    matchesDuplicate = n && nameCounts[n] > 1;
                }

                return matchesSearch && matchesDuplicate;
            });

            if (showDuplicatesOnly) filteredHistory.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-6 animate-fade-in flex flex-col h-[calc(100vh-100px)] pb-20">
                    <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center">
                                {viewTitle}
                                {!readonly && <span className="ml-3 px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full flex items-center shadow-sm">
                                    <span className="w-2 h-2 rounded-full bg-green-500 mr-1 animate-pulse"></span> 即時同步
                                </span>}
                            </h2>
                            <p className="text-sm text-slate-500 mt-1">目前顯示 {filteredHistory.length} 筆資料</p>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-2 w-full xl:w-auto bg-white p-2 rounded-lg border border-slate-200 shadow-sm">
                            {!readonly && <Button variant={showDuplicatesOnly ? 'ai' : 'secondary'} onClick={() => setShowDuplicatesOnly(!showDuplicatesOnly)} className={`text-xs py-2 px-3 whitespace-nowrap ${showDuplicatesOnly ? '' : 'text-violet-700 border-violet-200 hover:bg-violet-50'}`}>
                                {showDuplicatesOnly ? '取消篩選 (顯示全部)' : '🔍 尋找重複人名'}
                            </Button>}
                            
                            {!readonly && <div className="h-6 w-px bg-slate-200 hidden sm:block mx-1"></div>}
                            
                            <Button variant="secondary" onClick={() => onExportExcel(filteredHistory)} className="text-xs py-2 px-3 whitespace-nowrap border-green-200 text-green-700 hover:bg-green-50">匯出 Excel</Button>
                            <Button variant="secondary" onClick={() => onExportCSV(filteredHistory)} className="text-xs py-2 px-3 whitespace-nowrap">匯出 CSV</Button>
                            
                            <div className="h-6 w-px bg-slate-200 hidden sm:block mx-1"></div>

                            <div className="relative flex-1 sm:w-48 min-w-[150px]">
                                <Search size={16} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                                <input type="text" placeholder="搜尋姓名、標籤、情境..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm" />
                            </div>
                            <Button variant="secondary" onClick={onBack} icon={ArrowLeft} className="whitespace-nowrap py-2 px-3">返回</Button>
                        </div>
                    </div>

                    {showDuplicatesOnly && !readonly && (
                        <div className="mb-4 bg-violet-50 text-violet-800 p-4 rounded-lg border border-violet-200 text-sm flex items-start shadow-sm animate-fade-in flex-col sm:flex-row gap-3">
                            <Sparkles size={24} className="text-violet-600 flex-shrink-0 mt-0.5 hidden sm:block" />
                            <div>
                                <strong className="block mb-1 text-base">已啟動「尋找重複」模式</strong>
                                系統已為您找出姓名重複的聯絡人，並將相同的姓名排列在一起。<br/>
                                <div className="mt-2 bg-white/60 p-2 rounded border border-violet-100">
                                    💡 <strong className="text-violet-700">對方升遷或換公司了？ (合併資料)</strong><br/>
                                    您可以點擊新名片的「編輯」，將舊名片的職稱與公司填入新名片的<span className="font-bold">「職務異動 / 其他抬頭」</span>欄位中，再將舊名片刪除，即可完美保留人脈軌跡！
                                </div>
                            </div>
                        </div>
                    )}

                    <Card className="flex-1 flex flex-col overflow-hidden bg-white">
                        {filteredHistory.length === 0 ? (
                            <div className="flex flex-col items-center justify-center flex-1 py-12 text-slate-500">
                                <Database size={48} className="mb-4 text-slate-300" />
                                <p className="text-lg font-medium">{showDuplicatesOnly ? '🎉 恭喜！目前沒有發現重複的聯絡人資料。' : '沒有找到符合的資料'}</p>
                            </div>
                        ) : (
                            <div className="flex-1 overflow-x-auto overflow-y-auto">
                                <table className="w-full text-left border-collapse min-w-[800px]">
                                    <thead className="bg-slate-50 sticky top-0 z-10 shadow-sm">
                                        <tr>
                                            <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">姓名 (中 / 英)</th>
                                            <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">公司 / 職稱 / 標籤</th>
                                            <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">聯絡方式 / 情境</th>
                                            <th className="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredHistory.map((item) => (
                                            <tr key={item.id} className="hover:bg-slate-50 transition-colors group">
                                                <td className="px-6 py-4 align-top">
                                                    <div className="flex flex-wrap items-baseline gap-x-2">
                                                        <span className="font-bold text-slate-800 text-lg leading-tight">{item.name || '-'}</span>
                                                        {item.name_eng && <span className="text-sm text-slate-500 font-medium tracking-wide">{item.name_eng}</span>}
                                                    </div>
                                                    {item.capture_date && <div className="text-[11px] text-slate-400 mt-2">建檔: {new Date(item.capture_date).toLocaleDateString()}</div>}
                                                </td>
                                                <td className="px-6 py-4 align-top">
                                                    <div className="font-medium text-slate-700 leading-tight">{item.company || '-'}</div>
                                                    <div className="text-sm text-slate-500 mt-1">{item.title}</div>
                                                    {item.careerHistory && (
                                                        <div className="text-[11px] text-slate-400 mt-1.5 flex items-start">
                                                            <RefreshCw size={10} className="mr-1 mt-0.5 flex-shrink-0" /> {item.careerHistory}
                                                        </div>
                                                    )}
                                                    {item.tags && item.tags.length > 0 && (
                                                        <div className="flex flex-wrap gap-1 mt-2">
                                                            {item.tags.slice(0, 3).map((tag, i) => <span key={i} className="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] rounded-full font-medium border border-blue-100">{tag}</span>)}
                                                            {item.tags.length > 3 && <span className="px-1 py-0.5 text-slate-400 text-[10px]">+{item.tags.length - 3}</span>}
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="px-6 py-4 align-top">
                                                    <div className="text-sm text-slate-600 flex items-center mb-1"><span className="w-10 inline-block text-xs text-slate-400">手機:</span> {item.phone_mobile || '-'}</div>
                                                    <div className="text-sm text-slate-600 flex items-center"><span className="w-10 inline-block text-xs text-slate-400">Email:</span> {item.email || '-'}</div>
                                                    {item.meetContext && (
                                                        <div className="text-[11px] text-indigo-600 flex items-start mt-2 bg-indigo-50 px-2 py-1 rounded inline-block">
                                                            <MapPin size={12} className="mr-1 mt-0.5 flex-shrink-0"/> <span className="truncate max-w-[150px]" title={item.meetContext}>{item.meetContext}</span>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="px-6 py-4 text-right align-top">
                                                    {deletingId === item.id ? (
                                                        <div className="flex items-center justify-end gap-2 animate-fade-in">
                                                            <button onClick={() => { onDelete(item.id); setDeletingId(null); }} className="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded transition shadow-sm font-bold">確定刪除</button>
                                                            <button onClick={() => setDeletingId(null)} className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded transition">取消</button>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-center justify-end gap-2 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => onSelect(item)} className="px-3 py-1.5 text-sm bg-slate-800 text-white rounded hover:bg-slate-700 transition flex items-center shadow-sm">
                                                                {readonly ? <Eye size={14} className="mr-1"/> : <FileText size={14} className="mr-1"/>} 
                                                                {readonly ? '檢視' : '編輯'}
                                                            </button>
                                                            {!readonly && <button onClick={() => setDeletingId(item.id)} className="p-1.5 text-red-500 hover:bg-red-50 hover:text-red-600 rounded transition border border-transparent hover:border-red-200"><X size={18} /></button>}
                                                        </div>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        const DashboardView = ({ onUpload, onCamera, savedCount, onExportCSV, onExportExcel, onExportJSON, onImportJSON, onCloudSync, isSyncing, hasScriptUrl, onOpenHistory, onBulkImport, isImporting, profile }) => {

            const bulkImportRef = useRef(null);
