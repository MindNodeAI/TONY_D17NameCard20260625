<body class="bg-slate-50 text-slate-800">

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Camera, Upload, Settings, Save, User, FileText, Download, X, Check, Loader2, Search, HelpCircle, ExternalLink, CloudLightning, Sparkles, Lightbulb, Copy, MessageSquare, Image as ImageIcon, Mail, Database, UploadCloud, RefreshCw, FilePlus, MapPin, Tag } from 'lucide-react';

        // --- Firebase Init ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZv3x12RuMke6eEg8qB88Uv5vuuF_PrD0",
            authDomain: "d17-business-card-recognition.firebaseapp.com",
            projectId: "d17-business-card-recognition",
            storageBucket: "d17-business-card-recognition.firebasestorage.app",
            messagingSenderId: "1037041583244",
            appId: "1:1037041583244:web:d0d818ce12da14f48967a9",
            measurementId: "G-0KKH08BTMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- Config ---
        const APP_CONFIG = {
            title: "名片辨識 APP",
            version: "3.1 (CRM 關係進化版)", 
            themeColor: "bg-slate-800",
            logoUrl: "https://i.postimg.cc/fT2sQW09/1.png",
            profileUrl: "https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg",
            copyright: "© 2026 TONY STUDIO. 本教材由 TONY STUDIO 楊文澤顧問設計. All Rights Reserved."
        };

        const DEFAULT_SCHEMA = {
            name: "", title: "", company: "", phone_mobile: "", phone_office: "", email: "", address: "", website: "", notes: "",
            meetDate: new Date().toISOString().split('T')[0], // 新增：預設為今天
            careerHistory: "", // 新增：經歷與其他抬頭
            meetContext: "", tags: [], aiInsights: { industry: "", roleExpertise: "", companyNature: "", businessType: "" }
        };

        const FIELD_LABELS = {
            meetDate: "📅 認識 / 換片日期", meetContext: "📍 互動情境 (在哪裡認識？)", name: "姓名 Name", title: "職稱 Title", company: "公司名稱 Company", 
            careerHistory: "🔄 職務異動 / 其他抬頭 (Career History)", phone_mobile: "行動電話 Mobile", phone_office: "公司電話 Tel", email: "電子郵件 Email", address: "地址 Address", website: "網站 Website", notes: "備註 Notes"
        };

        const EXPORT_HEADERS = {
            name: "姓名", title: "職稱", company: "公司名稱", careerHistory: "職務異動/其他抬頭", phone_mobile: "行動電話", phone_office: "公司電話", 
            email: "Email", address: "地址", website: "網站", meetDate: "認識日期", meetContext: "互動情境(哪裡認識)", notes: "備註", capture_date: "建檔時間"
        };

        // --- Helpers ---
        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = (error) => reject(error);
            });
        };

        const compressImage = (file, maxWidth = 1200, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl); 
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        const downloadJSON = (data) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `business_cards_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const downloadCSV = (data) => {
            const keys = Object.keys(EXPORT_HEADERS);
            const csvContent = [
                keys.map(k => EXPORT_HEADERS[k]).join(','), 
                ...data.map(row => keys.map(key => {
                    let val = row[key] || '';
                    if (key === 'capture_date' && val) val = new Date(val).toLocaleDateString();
                    val = val.toString().replace(/"/g, '""');
                    return `"${val}"`;
                }).join(','))
            ].join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `business_cards_export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const downloadExcel = (data) => {
            if (typeof XLSX === 'undefined') {
                alert("Excel 匯出模組尚未載入，請稍後再試。");
                return;
            }
            const keys = Object.keys(EXPORT_HEADERS);
            const exportData = data.map(row => {
                let newRow = {};
                keys.forEach(key => {
                    let val = row[key] || '';
                    if (key === 'capture_date' && val) val = new Date(val).toLocaleDateString();
                    newRow[EXPORT_HEADERS[key]] = val;
                });
                return newRow;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "名片資料");
            XLSX.writeFile(workbook, `business_cards_export_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        // --- Components ---
        const Card = ({ children, className = "", onClick }) => (
            <div onClick={onClick} className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, icon: Icon }) => {
            const baseStyle = "flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-slate-800 text-white hover:bg-slate-700 shadow-md",
                secondary: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 shadow-sm",
                danger: "bg-red-500 text-white hover:bg-red-600",
                ai: "bg-gradient-to-r from-violet-600 to-indigo-600 text-white hover:from-violet-700 hover:to-indigo-700 shadow-md border border-violet-400",
                success: "bg-green-600 text-white hover:bg-green-700 shadow-md"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant] || variants.primary} ${className}`}>
                    {Icon && <Icon size={18} className="mr-2" />}
                    {children}
                </button>
            );
        };

        const SettingsView = ({ apiKey, setApiKey, scriptUrl, setScriptUrl, onBack }) => {
            const [showHelp, setShowHelp] = useState(false);
            return (
                <div className="max-w-2xl mx-auto p-6 animate-fade-in pb-20">
                    <Card className="p-6">
                        <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center">
                            <Settings className="mr-2" /> 設定與 API 管理
                        </h2>
                        <div className="space-y-6">
                            <div className="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-lg text-sm mb-4">
                                💡 提示：您的設定會自動儲存在此瀏覽器中。
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">Google Gemini API Key (必填)</label>
                                <input 
                                    type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="輸入您的 AI Studio Key..."
                                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none"
                                />
                            </div>
                            <div className="pt-4 border-t border-slate-100">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="block text-sm font-medium text-slate-700 flex items-center">
                                        <CloudLightning size={16} className="mr-1 text-green-600" />
                                        Google Apps Script URL (雲端同步用)
                                    </label>
                                    <button onClick={() => setShowHelp(!showHelp)} className="text-xs text-blue-600 hover:text-blue-800 flex items-center">
                                        <HelpCircle size={14} className="mr-1" /> 如何設定?
                                    </button>
                                </div>
                                <input 
                                    type="text" value={scriptUrl} onChange={(e) => setScriptUrl(e.target.value)}
                                    placeholder="https://script.google.com/macros/s/..../exec"
                                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none font-mono text-sm"
                                />
                                {showHelp && (
                                    <div className="mt-3 p-3 bg-blue-50 border border-blue-100 rounded-lg text-xs text-slate-600 space-y-2">
                                        <p className="font-bold text-blue-800">GAS 寫入失敗或 Failed to fetch 排除清單：</p>
                                        <ol className="list-decimal list-inside space-y-1">
                                            <li>GAS 必須包含 <code>doGet</code> 與 <code>doPost</code> 函數。</li>
                                            <li>是否已按下「部署」&gt;「建立新版本」？(最常忘記)</li>
                                            <li>權限是否設為「所有人 (Anyone)」？</li>
                                            <li>網址結尾應為 <code>/exec</code>。</li>
                                        </ol>
                                    </div>
                                )}
                            </div>
                            <div className="pt-4 border-t border-slate-100 flex justify-end">
                                <Button onClick={onBack} variant="primary">確認並返回</Button>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AboutView = ({ onBack }) => {
            return (
                <div className="max-w-4xl mx-auto p-6 animate-fade-in pb-20">
                    <div className="mb-6">
                        <Button onClick={onBack} variant="secondary" icon={X}>關閉</Button>
                    </div>
                    <Card className="p-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="col-span-1 flex flex-col items-center text-center">
                                <div className="w-48 h-48 rounded-full overflow-hidden border-4 border-slate-100 shadow-lg mb-4">
                                    <img src={APP_CONFIG.profileUrl} alt="TONY 老師" className="w-full h-full object-cover" />
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800">TONY 老師</h2>
                                <p className="text-slate-500 font-medium">AI 導師 / 資深顧問 / 創業家</p>
                            </div>
                            <div className="col-span-1 md:col-span-2 space-y-6">
                                <div>
                                    <h3 className="text-lg font-bold text-slate-800 border-b border-slate-200 pb-2 mb-3">關於創作者</h3>
                                    <div className="text-slate-600 leading-relaxed space-y-4">
                                        <p>
                                            我是一位擁有深厚業界經驗的品牌行銷、行銷科技 (MarTech)、生成式 AI 創作者及專業講師。
                                            熱愛創新與思考，致力於將複雜的商業理論轉化為落地的實戰應用。
                                        </p>
                                        <p>
                                            我具備設計、行銷、商業與創業的全方位實務經驗，並曾於上市公司擔任長達 14 年的發言人，
                                            深知企業運營、媒體公關與人脈管理的核心痛點。
                                        </p>
                                        <p>
                                            開發這款「名片辨識 APP」的初衷，正是希望能結合最新的 AI 技術，解決商務人士在人脈整理上的繁瑣工作。
                                            透過科技賦能，讓我們能將更多寶貴的時間，專注於人與人之間真實的交流與價值的創造。
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const AiAssistant = ({ data, apiKey }) => {
            const [aiResult, setAiResult] = useState(null); 
            const [aiLoading, setAiLoading] = useState(false);
            const [activeTab, setActiveTab] = useState(null); 
            const [copied, setCopied] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const generateContent = async (type) => {
                if (!apiKey) {
                    setErrorMsg("請先設定 API Key 才能使用 AI 功能！");
                    setTimeout(() => setErrorMsg(''), 4000);
                    return;
                }
                setAiLoading(true); setActiveTab(type); setAiResult(null); setCopied(false); setErrorMsg('');

                let prompt = "";
                if (type === 'email') {
                    prompt = `Act as a top-tier business secretary. Write a professional follow-up email in Traditional Chinese (繁體中文) to: Name: ${data.name}, Title: ${data.title}, Company: ${data.company}. REQUIREMENTS: 1. Tone: Warm, professional. 2. Output Format: Subject: [Subject] Body: [Body]`;
                } else {
                    prompt = `Act as a networking coach. Analyze this person: ${data.title} at ${data.company}. OUTPUT FORMAT: Subject: 🔍 職涯與話題分析 Body: 【職責推測】[Analysis] 【破冰三招】1. [Topic 1] 2. [Topic 2] 3. [Topic 3]`;
                }

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const result = await response.json();
                    if (result.error) throw new Error(result.error.message);
                    
                    const rawText = result.candidates[0].content.parts[0].text;
                    let subject = "商務信件"; let body = rawText;
                    const subjectMatch = rawText.match(/Subject:\s*(.*)/i);
                    const bodyMatch = rawText.match(/Body:\s*([\s\S]*)/i);
                    if (subjectMatch && bodyMatch) {
                        subject = subjectMatch[1].trim(); body = bodyMatch[1].trim();
                    }
                    setAiResult({ subject, body, raw: rawText });
                } catch (e) {
                    setAiResult({ subject: "發生錯誤", body: "AI 生成失敗: " + e.message, raw: "" });
                } finally {
                    setAiLoading(false);
                }
            };

            const copyToClipboard = () => {
                if (!aiResult) return;
                const textToCopy = `主旨：${aiResult.subject}\n\n${aiResult.body}`;
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.select();
                try { 
                    document.execCommand('copy'); 
                    setCopied(true); 
                    setTimeout(() => setCopied(false), 2000); 
                } catch (err) { 
                    setErrorMsg("複製失敗。");
                    setTimeout(() => setErrorMsg(''), 3000);
                }
                document.body.removeChild(textArea);
            };

            return (
                <div className="mt-8 border-t border-slate-200 pt-6">
                    <h4 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center">
                        <Sparkles size={16} className="mr-2 text-violet-500" /> AI 智能軍師
                    </h4>
                    
                    {errorMsg && (
                        <div className="mb-4 bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200">
                            {errorMsg}
                        </div>
                    )}

                    <div className="flex gap-3 mb-6">
                        <Button variant="ai" className="flex-1 text-sm py-3" icon={Mail} onClick={() => generateContent('email')} disabled={aiLoading}>
                            {aiLoading && activeTab === 'email' ? '撰寫中...' : '生成商務信'}
                        </Button>
                        <Button variant="secondary" className="flex-1 text-sm border-violet-200 text-violet-700 hover:bg-violet-50" icon={Lightbulb} onClick={() => generateContent('insight')} disabled={aiLoading}>
                            {aiLoading && activeTab === 'insight' ? '分析中...' : '話題分析'}
                        </Button>
                    </div>

                    {(aiResult || aiLoading) && (
                        <div className="animate-fade-in">
                            {aiLoading ? (
                                <div className="bg-slate-50 rounded-xl border border-slate-200 p-8 flex flex-col items-center justify-center text-slate-500">
                                    <Loader2 size={32} className="animate-spin mb-2 text-violet-500" />
                                    <p className="text-sm">AI 正在為您構思內容...</p>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden ring-1 ring-slate-200">
                                    <div className="bg-slate-100 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                                        <div className="flex items-center">
                                            <span className="text-xs font-bold text-slate-500 uppercase mr-2">主旨:</span>
                                            <span className="text-sm font-medium text-slate-800">{aiResult.subject}</span>
                                        </div>
                                    </div>
                                    <div className="p-6 bg-white min-h-[150px]">
                                        <p className="whitespace-pre-wrap text-sm text-slate-700 leading-relaxed font-sans">{aiResult.body}</p>
                                    </div>
                                    <div className="bg-slate-50 px-4 py-3 border-t border-slate-200 flex justify-end">
                                        <button onClick={copyToClipboard} className={`flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${copied ? "bg-green-100 text-green-700" : "bg-slate-800 text-white hover:bg-slate-700 shadow"}`}>
                                            {copied ? <Check size={16} className="mr-2" /> : <Copy size={16} className="mr-2" />}
                                            {copied ? "已複製成功！" : "複製全部內容"}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const EditView = ({ data, imagePreview, onSave, onCancel, onChange, isSaving, apiKey }) => (
            <div className="max-w-6xl mx-auto p-4 md:p-6 animate-fade-in flex flex-col md:flex-row gap-6 pb-20">
                <div className="w-full md:w-1/2 flex flex-col">
                    <Card className="flex-1 bg-slate-100 flex items-center justify-center relative p-4 min-h-[300px]">
                        {imagePreview ? (
                            <img src={imagePreview} alt="Uploaded" crossOrigin="anonymous" className="max-w-full max-h-[60vh] object-contain shadow-lg rounded" />
                        ) : (
                            <div className="text-center text-slate-400 flex flex-col items-center">
                                <ImageIcon size={64} className="mb-3 opacity-50" />

        const DashboardView = ({ onUpload, onCamera, savedCount, onExportCSV, onExportExcel, onExportJSON, onImportJSON, onCloudSync, isSyncing, hasScriptUrl, onOpenHistory, onBulkImport, isImporting }) => {

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

                            <p>準備好整理您的人脈了嗎？請選擇下方的輸入方式。</p>

                            <h3 className="text-xl font-bold text-slate-800 mb-1">相機拍攝</h3>
                            <p className="text-slate-500 text-sm">直接使用裝置相機拍攝實體名片。</p>
                        </button>
                        <label className="cursor-pointer group relative overflow-hidden rounded-2xl bg-white border-2 border-dashed border-slate-300 hover:border-slate-500 p-8 transition-all hover:shadow-lg text-left block">
                            <input type="file" className="hidden" accept="image/*" onChange={onUpload} />
                            <div className="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4"><Upload size={24} /></div>
                            <h3 className="text-xl font-bold text-slate-800 mb-1">上傳圖片</h3>
                            <p className="text-slate-500 text-sm">支援 JPG, PNG 格式的名片圖檔。</p>

                    </div>

                    <div className="flex flex-col sm:flex-row gap-4 mb-8">

                            <>
                                <Button variant="secondary" icon={Download} onClick={onExportExcel} className="flex-1 text-sm border-green-200 text-green-700 hover:bg-green-50">匯出 Excel</Button>
                                <Button variant="secondary" icon={Download} onClick={onExportCSV} className="flex-1 text-sm">匯出 CSV</Button>
                                <Button variant="primary" icon={Search} onClick={onOpenHistory} className="flex-1 sm:flex-none sm:w-1/3 text-sm">名片資料總表</Button>
                            </>
                        )}
                    </div>

                    {/* 多格式匯入合併區塊 */}
                    <div className="mt-8 pt-6 border-t border-slate-200">
                        <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center">

                        </h3>
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-4">

                                    系統會自動解析內容並合併到雲端名片庫中。PDF/Word 文件將使用 AI 智慧萃取，請確保已於設定中填入 API Key。
                                </span>
                            </p>
                            <input type="file" accept=".csv, .xlsx, .pdf, .docx" className="hidden" ref={bulkImportRef} onChange={onBulkImport} disabled={isImporting} />
                            <Button variant="ai" className="w-full sm:w-auto" icon={isImporting ? Loader2 : FilePlus} onClick={() => bulkImportRef.current?.click()} disabled={isImporting}>

                    {/* 資料備份與雲端同步區塊 */}

            );
        };

        function App() {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
            const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('google_script_url') || ''); 
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [importing, setImporting] = useState(false);
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState(''); 
            const [userId, setUserId] = useState(null);
            
            const [currentImage, setCurrentImage] = useState(null);
            const [currentData, setCurrentData] = useState(DEFAULT_SCHEMA);
            const [history, setHistory] = useState([]);

            const fileInputRef = useRef(null);

            // 初始化 Firebase 匿名登入
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const userCredential = await signInAnonymously(auth);
                        setUserId(userCredential.user.uid);
                    } catch (err) {
                        setError("Firebase 登入失敗: " + err.message);
                    }
                };
                initAuth();
            }, []);

            // 監聽 Firestore 即時資料
            useEffect(() => {
                if (!userId) return;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';
                const cardsRef = collection(db, 'artifacts', activeAppId, 'users', userId, 'business_cards');
                
                const unsubscribe = onSnapshot(cardsRef, (snapshot) => {
                    const cards = [];
                    snapshot.forEach((doc) => {
                        cards.push({ id: doc.id, ...doc.data() });
                    });
                    cards.sort((a, b) => new Date(b.capture_date) - new Date(a.capture_date));
                    setHistory(cards);
                }, (err) => {
                    console.error("Firestore sync error", err);
                    setError("讀取雲端資料失敗，請確認已設定正確的 Firebase Security Rules。");
                });

                return () => unsubscribe();
            }, [userId]);

            useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);
            useEffect(() => { localStorage.setItem('google_script_url', scriptUrl); }, [scriptUrl]);
            useEffect(() => { localStorage.setItem('card_history', JSON.stringify(history)); }, [history]);

            const processImage = async (file) => {
                if (!apiKey) { 
                    setError("請先設定 Gemini API Key！"); 
                    setView('settings'); 
                    return; 
                }
                setLoading(true); setError('');
                try {
                    const dataUrl = await compressImage(file);
                    setCurrentImage(dataUrl);
                    
                    const base64Data = dataUrl.split(',')[1];
                    const prompt = `Act as an expert Relationship Intelligence AI. Extract info from the business card image.
Return ONLY a valid JSON object without any markdown formatting.
Keys required:
- name, title, company, phone_mobile, phone_office, email, address, website, notes (all string)
- careerHistory: string. If the card contains multiple titles, secondary roles, or former companies, put them here.
- meetContext: empty string
- tags: an array of strings (e.g. ["#科技業", "#決策者", "#潛在客戶"]). Generate semantic tags based on the person's title and company.
- aiInsights: an object with 4 string keys: "industry" (推測產業), "roleExpertise" (推測專業與負責事項), "companyNature" (推測公司業務性質), "businessType" (推測潛在商務關係).
If data is missing, leave string empty. Preserve Traditional Chinese.`;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }],
                            generationConfig: { response_mime_type: "application/json", temperature: 0 }
                        })
                    });
                    
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const parsedData = JSON.parse(data.candidates[0].content.parts[0].text);
                    setCurrentData({ ...DEFAULT_SCHEMA, ...parsedData });
                    setView('edit');
                } catch (err) {
                    setError("辨識失敗: " + err.message);
                } finally { setLoading(false); }
            };

            const handleSaveCard = async () => {
                if (!userId) {
                    setError("尚未連線至 Firebase，無法儲存。");
                    return;
                }
                setSaving(true);
                const cardId = currentData.id || crypto.randomUUID();
                let imageUrl = currentData.imageUrl || null;

                try {
                    if (currentImage && currentImage.startsWith('data:image')) {
                        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';
                        const imageRef = ref(storage, `artifacts/${activeAppId}/users/${userId}/images/${cardId}.jpg`);
                        await uploadString(imageRef, currentImage, 'data_url');
                        imageUrl = await getDownloadURL(imageRef);
                    }

                    const newCard = { 
                        ...currentData, 
                        id: cardId, 
                        imageUrl,
                        capture_date: currentData.capture_date || new Date().toISOString() 
                    };

                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';
                    const docRef = doc(db, 'artifacts', activeAppId, 'users', userId, 'business_cards', cardId);
                    
                    await setDoc(docRef, newCard);

                    setSuccessMsg("名片資料已成功儲存至 Firebase 雲端！");
                    setTimeout(() => setSuccessMsg(''), 3000);
                    setView('dashboard'); 
                    setCurrentData(DEFAULT_SCHEMA); 
                    setCurrentImage(null);
                } catch (err) {
                    setError("雲端儲存失敗: " + err.message);
                } finally { 
                    setSaving(false); 
                }
            };

            const handleBulkImport = async (e) => {
                const file = e.target.files?.[0];
                if (!file || !userId) return;
                
                const ext = file.name.split('.').pop().toLowerCase();
                if ((ext === 'pdf' || ext === 'docx') && !apiKey) {
                    setError("處理 PDF/Word 檔案需要 Gemini API Key，請先於設定中填寫！");
                    setView('settings');
                    return;
                }
                
                setImporting(true);
                setError('');
                try {
                    let extractedCards = [];
                    
                    if (ext === 'csv' || ext === 'xlsx') {
                        if (typeof XLSX === 'undefined') throw new Error("Excel 模組尚未載入");
                        const data = await file.arrayBuffer();
                        const workbook = XLSX.read(data);
                        const sheetName = workbook.SheetNames[0];
                        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        
                        extractedCards = json.map(row => {
                            const findKey = (keywords) => {
                                const key = Object.keys(row).find(k => keywords.some(kw => k.toLowerCase().includes(kw)));
                                return key ? String(row[key]) : "";
                            };
                            return {
                                name: findKey(['name', '名', '姓名']),
                                title: findKey(['title', '職称', '職稱', '職位']),
                                company: findKey(['company', '公司', '企業']),
                                phone_mobile: findKey(['mobile', 'cell', '行動', '手機']),
                                phone_office: findKey(['tel', 'office', '電話', '辦公']),
                                email: findKey(['email', 'mail', '信箱', '郵件']),
                                address: findKey(['address', '地址', '位置']),
                                website: findKey(['web', '網', '網址']),
                                meetContext: findKey(['context', '情境', '認識']),
                                notes: findKey(['note', '備註', '附註']) || "從外部檔案匯入"
                            };
                        });

                        // 新增：將解析出的基本 Excel 資料送給 AI 進行「情報擴充」
                        if (apiKey && extractedCards.length > 0) {
                            try {
                                extractedCards = await enrichCardsWithGemini(extractedCards);
                            } catch (enrichErr) {
                                console.warn("AI 情報擴充失敗，退回基本匯入:", enrichErr);
                                // 若因檔案太大導致 API 失敗，退回使用無 AI 情報的基本資料
                            }
                        }

                    } else if (ext === 'docx') {
                        const arrayBuffer = await file.arrayBuffer();
                        const result = await mammoth.extractRawText({arrayBuffer});
                        extractedCards = await extractCardsWithGemini(result.value, "text");
                    } else if (ext === 'pdf') {
                        const base64Data = await fileToBase64(file);
                        extractedCards = await extractCardsWithGemini(base64Data, "application/pdf");
                    } else {
                        throw new Error("不支援的檔案格式，請上傳 CSV, Excel, PDF 或 Word 檔。");
                    }

                    if (extractedCards.length > 0) {
                        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';
                        let added = 0;
                        for (const card of extractedCards) {
                            if (!card.name && !card.company) continue; 
                            const cardId = crypto.randomUUID();
                            const docRef = doc(db, 'artifacts', activeAppId, 'users', userId, 'business_cards', cardId);
                            await setDoc(docRef, {
                                ...DEFAULT_SCHEMA,
                                ...card,
                                id: cardId,
                                capture_date: new Date().toISOString()
                            });
                            added++;
                        }
                        setSuccessMsg(`成功匯入並智能分析 ${added} 筆名片資料至雲端！`);
                        setTimeout(() => setSuccessMsg(''), 5000);
                    } else {
                        setError("未在檔案中找到任何可匯入的名片資料。");
                    }
                } catch (err) {
                    setError("匯入失敗: " + err.message);
                } finally {
                    setImporting(false);
                    e.target.value = ''; 
                }
            };

            // 新增：專門處理 Json 陣列情報擴充的函數
            const enrichCardsWithGemini = async (cards) => {
                const prompt = `You are an expert Relationship Intelligence AI. I am providing a JSON array of basic business card records extracted from a spreadsheet.
For each record, analyze the 'title' and 'company' fields to generate:
1. 'tags': an array of semantic string tags (e.g., ["#高階主管", "#科技業"]).
2. 'aiInsights': an object with 4 keys: "industry" (推測產業), "roleExpertise" (推測專業與負責事項), "companyNature" (推測公司業務性質), "businessType" (推測潛在商務關係).
Merge these new fields into the original objects. Return the COMPLETE, updated JSON array. Do not remove any original fields. Output ONLY a valid JSON ARRAY. Preserve Traditional Chinese.`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { text: JSON.stringify(cards) }] }],
                        generationConfig: { response_mime_type: "application/json", temperature: 0 }
                    })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                return JSON.parse(resData.candidates[0].content.parts[0].text);
            };

            const extractCardsWithGemini = async (data, type) => {
                const prompt = `You are an expert Relationship Intelligence AI. Extract ALL business card information from the document. Output a valid JSON ARRAY of objects. Each object must have these EXACT keys: name, title, company, phone_mobile, phone_office, email, address, website, notes, meetContext (all string). tags: an array of semantic string tags (e.g. ["#主管", "#零售業"]). aiInsights: an object with keys "industry", "roleExpertise", "companyNature", "businessType" containing inferred business intelligence. If no data found, return []. Preserve Traditional Chinese.`;
                let contents = type === "text" 
                    ? [{ parts: [{ text: prompt }, { text: data }] }]
                    : [{ parts: [{ text: prompt }, { inlineData: { mimeType: type, data: data } }] }];

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents, generationConfig: { response_mime_type: "application/json", temperature: 0 } })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                return JSON.parse(resData.candidates[0].content.parts[0].text);
            };

            const handleCloudSync = async () => {
                if (!scriptUrl) return;
                
                let cleanUrl = scriptUrl.trim();
                if (!cleanUrl.startsWith('http')) {
                    setError("錯誤：網址格式不正確，請確保有包含 http 或 https 開頭。");
                    return;
                }

                setSyncing(true);
                setError('');
                setSuccessMsg('');

                try {
                    const response = await fetch(cleanUrl);
                    const textData = await response.text();
                    
                    try {
                        const cloudData = JSON.parse(textData);
                        if (cloudData.error) {
                            setError(`Google 雲端回傳錯誤：\n${cloudData.error}\n請檢查試算表中是否有空行或特殊格式。`);
                            return;
                        }
                        if (!Array.isArray(cloudData)) throw new Error("資料不是陣列");

                        let addedCount = 0;
                        const currentIds = new Set(history.map(item => String(item.id)));
                        const newHistory = [...history];

                        cloudData.forEach(item => {
                            if (item.id && !currentIds.has(String(item.id))) {
                                newHistory.push(item);
                                currentIds.add(String(item.id));
                                addedCount++;
                            }
                        });

                        newHistory.sort((a, b) => new Date(b.capture_date) - new Date(a.capture_date));
                        setHistory(newHistory);
                        setSuccessMsg(`雲端同步成功！新增了 ${addedCount} 筆資料。`);
                        setTimeout(() => setSuccessMsg(''), 4000);
                        
                    } catch (parseError) {
                        setError(`雲端同步失敗：無法解析資料。\n\n請使用無痕視窗開啟您的 GAS 網址檢查真實錯誤。`);
                    }
                } catch (err) {
                    setError("遭瀏覽器安全攔截 (Failed to fetch)。\n\n👉 檢查 GAS：\n1. 需有防禦版 doGet 函數並回傳 JSON。\n2. 權限為「所有人」。\n3. 務必「建立新版本」。");
                } finally {
                    setSyncing(false);
                }
            };

            const handleImportJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (!Array.isArray(importedData)) throw new Error("格式錯誤");
                        
                        let addedCount = 0;
                        const currentIds = new Set(history.map(item => String(item.id)));
                        const newHistory = [...history];

                        importedData.forEach(item => {
                            if (item.id && !currentIds.has(String(item.id))) {
                                newHistory.push(item);
                                currentIds.add(String(item.id));
                                addedCount++;
                            }
                        });
                        newHistory.sort((a, b) => new Date(b.capture_date) - new Date(a.capture_date));
                        setHistory(newHistory);
                        setSuccessMsg(`備份載入成功！共新增 ${addedCount} 筆不重複的資料。`);
                        setTimeout(() => setSuccessMsg(''), 3000);
                    } catch (err) { setError("載入失敗：無效的 JSON 檔案。"); }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            return (
                <div className="min-h-[100dvh] bg-slate-50 font-sans flex flex-col text-slate-800">
                    <input type="file" accept="image/*" capture="environment" ref={fileInputRef} className="hidden" onChange={(e) => e.target.files?.[0] && processImage(e.target.files[0])} />
                    
                    <header className={`${APP_CONFIG.themeColor} text-white shadow-md sticky top-0 z-50`} style={{ paddingTop: 'max(env(safe-area-inset-top, 60px), 60px)' }}>
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('dashboard')}>
                                <img src={APP_CONFIG.logoUrl} alt="Logo" className="h-10 w-auto" />
                                <div className="hidden sm:block">
                                    <h1 className="text-lg font-bold tracking-wide">{APP_CONFIG.title}</h1>
                                    <span className="text-xs text-slate-300 block -mt-1">{APP_CONFIG.version}</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setView('about')} className="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-300 hover:text-white"><User size={20} /></button>
                                <button onClick={() => setView('settings')} className="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-300 hover:text-white"><Settings size={20} /></button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-7xl mx-auto py-6 px-4">
                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded shadow-sm flex justify-between items-center animate-fade-in">
                                <div className="flex items-center text-red-700 whitespace-pre-line text-sm"><span className="font-bold mr-2">錯誤：</span> {error}</div>
                                <button onClick={() => setError('')}><X size={18} className="text-red-400 hover:text-red-600 transition" /></button>
                            </div>
                        )}
                        {successMsg && (
                            <div className="bg-green-50 border-l-4 border-green-500 p-4 mb-6 rounded shadow-sm flex items-center animate-fade-in text-sm">
                                <Check size={18} className="mr-2 text-green-600" /> <span className="text-green-700">{successMsg}</span>
                            </div>
                        )}

                        {loading && (
                            <div className="flex flex-col items-center justify-center py-20 text-slate-600">
                                <Loader2 className="animate-spin mb-4 text-slate-800" size={48} />
                                <p className="font-medium animate-pulse">AI 正在深度解析名片與商業情報...</p>
                            </div>
                        )}

                        {!loading && view === 'dashboard' && <DashboardView onUpload={(e) => e.target.files?.[0] && processImage(e.target.files[0])} onCamera={() => fileInputRef.current && fileInputRef.current.click()} savedCount={history.length} onExportCSV={() => downloadCSV(history)} onExportExcel={() => downloadExcel(history)} onExportJSON={() => downloadJSON(history)} onImportJSON={handleImportJSON} onCloudSync={handleCloudSync} isSyncing={syncing} hasScriptUrl={!!scriptUrl} onOpenHistory={() => setView('history')} onBulkImport={handleBulkImport} isImporting={importing} />}
                        {!loading && view === 'settings' && <SettingsView apiKey={apiKey} setApiKey={setApiKey} scriptUrl={scriptUrl} setScriptUrl={setScriptUrl} onBack={() => setView('dashboard')} />}
                        {!loading && view === 'about' && <AboutView onBack={() => setView('dashboard')} />}
                        {!loading && view === 'edit' && <EditView data={currentData} imagePreview={currentImage} onChange={(field, value) => setCurrentData({...currentData, [field]: value})} onSave={handleSaveCard} onCancel={() => {setCurrentImage(null); setView('dashboard');}} isSaving={saving} apiKey={apiKey} />}
                        {!loading && view === 'history' && <HistoryView history={history} onBack={() => setView('dashboard')} onDelete={async (id) => { 
                            if (!userId) return;
                            try {
                                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'd17-business-card-recognition';
                                await deleteDoc(doc(db, 'artifacts', activeAppId, 'users', userId, 'business_cards', id));
                            } catch (err) {
                                setError("刪除失敗: " + err.message);
                            }
                        }} onSelect={(item) => { setCurrentData(item); setCurrentImage(item.imageUrl || null); setView('edit'); }} onExportCSV={downloadCSV} onExportExcel={downloadExcel} />}
                    </main>
                    <footer className="bg-slate-900 text-slate-500 py-4 text-center text-xs border-t border-slate-800"><p>{APP_CONFIG.copyright}</p></footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
